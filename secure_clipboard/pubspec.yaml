name: secure_clipboard
description: Secure clipboard manager with auto-clear and background protection
version: 0.0.1

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=3.0.0"

flutter:
  plugin:
    platforms:
      android:
        default_package: secure_clipboard_android
      ios:
        default_package: secure_clipboard_ios

dependencies:
  flutter:
    sdk: flutter
  secure_clipboard_platform_interface:
    path: ../secure_clipboard_platform_interface
  secure_clipboard_android:
    path: ../secure_clipboard_android
  secure_clipboard_ios:
    path: ../secure_clipboard_ios

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
