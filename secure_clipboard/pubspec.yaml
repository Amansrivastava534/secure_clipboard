name: secure_clipboard
description: Secure clipboard manager with auto-clear and background protection
version: 0.1.2
homepage: https://github.com/Amansrivastava534/secure_clipboard
repository: https://github.com/Amansrivastava534/secure_clipboard

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

flutter:
  plugin:
    platforms:
      android:
        default_package: secure_clipboard_android
      ios:
        default_package: secure_clipboard_ios

dependencies:
  flutter:
    sdk: flutter
  secure_clipboard_platform_interface: ^0.1.2
  secure_clipboard_android: ^0.1.2
  secure_clipboard_ios: ^0.1.2
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
