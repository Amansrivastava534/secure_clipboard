name: secure_clipboard_android
version: 0.0.2
description: Android implementation of the secure_clipboard Flutter plugin.
homepage: https://github.com/Amansrivastava534/secure_clipboard
repository: https://github.com/Amansrivastava534/secure_clipboard

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=3.0.0"

flutter:
  plugin:
    implements: secure_clipboard
    platforms:
      android:
        package: com.example.secure_clipboard_android
        pluginClass: SecureClipboardAndroidPlugin

dependencies:
  flutter:
    sdk: flutter
  secure_clipboard_platform_interface: ^0.0.2
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
